<aside class="h-screen" [tuiNavigationAside]="isAsideOpen">

    <header class="flex flex-row justify-right">
        <button (click)="toggleSidebar()" iconEnd="@tui.panel-left-dashed" tuiAsideItem type="button">
        </button>
    </header>
    <button iconStart="@tui.home" tuiAsideItem type="button">
        <span tuiFade>Home</span>
    </button>
    <button iconStart="@tui.search" tuiAsideItem type="button">
        Search
    </button>
    <a iconStart="@tui.users" tuiAsideItem>
        Groups
    </a>
    <tui-aside-group [(open)]="open">
        <button iconStart="@tui.settings" tuiAsideItem tuiChevron type="button">
            Settings
            <ng-template>
                <button tuiAsideItem type="button" (click)="open = false">
                    Account
                </button>
                <button tuiAsideItem type="button" (click)="open = false">
                    Notifications
                </button>
                <button tuiAsideItem type="button" (click)="open = false">
                    Privacy
                </button>
            </ng-template>
        </button>
    </tui-aside-group>
    <tui-aside-group [(open)]="open">
        <button iconStart="@tui.settings" tuiAsideItem tuiChevron type="button">
            Notifications
            <ng-template>
                <button tuiAsideItem type="button" [routerLink]="'/templates'">
                    Internal templates
                </button>
                <button tuiAsideItem type="button" (click)="open = false">
                    External templates
                </button>
                <button tuiAsideItem type="button" (click)="open = false">
                    External Notifications
                </button>
            </ng-template>
        </button>
    </tui-aside-group>
    <button iconStart="@tui.heart" tuiAsideItem type="button">
        <span tuiFade>By default ellipsis is used but you can use fade too</span>
    </button>
    <hr />
    <button appearance="accent" iconStart="@tui.plus" tuiAsideItem type="button">
        Add
    </button>
    <footer>
        <button iconStart="@tui.star" tuiAsideItem type="button">
            Favorites
        </button>
    </footer>
</aside>
